services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    depends_on:
      - torbox-media-center
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - torbox_data:/mnt/torbox:ro # Read-only to avoid modifying TorBox files
      - ./app_config:/app/config:rw
      - ./plex_media:/Media:rw # Where we'll create the symlinks
      - ./plex_config:/plex_config:rw # To edit Preferences.xml
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=UTC
      - CONFIG_PATH=/app/config/config.yaml
      - MOUNT_POINT=/mnt/torbox
      - VFS_PROVIDER=torbox-media-center
    dns:
      - 8.8.8.8
      - 1.1.1.1

  torbox-media-center:
    image: ghcr.io/torbox-app/torbox-media-center:main
    container_name: torbox-media-center
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - torbox_data:/mnt/torbox
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - MOUNT_METHOD=fuse
      - MOUNT_PATH=/mnt/torbox
      - RAW_MODE=true

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - VERSION=docker
    volumes:
      - ./plex_config:/config
      - ./plex_media:/Media
      - ./plex_init.sh:/custom-cont-init.d/vfs_init.sh:ro
      - torbox_data:/mnt/torbox:rw
      - /dev/shm:/transcode
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    ports:
      - "32400:32400"
    restart: unless-stopped
    depends_on:
      - backend # Esperar a que exista el backend/symlink creator
      - torbox-media-center

volumes:
  torbox_data:
